[versions]
# libraries
bson4Jackson = "3.2.0"
jackson = "3.2.0"
junit = "4.13.2"
mongodb-bson = "5.8.0"
opentest4j = "1.3.0"

# plugins
changelog = "2.5.0"
intelliJPlatform = "2.16.0"
kotlin = "2.4.0"
kover = "0.9.8"
qodana = "2026.1.0"

[libraries]
bson4jackson = { module = "de.undercouch:bson4jackson", version.ref = "bson4Jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-core = { module = "tools.jackson.core:jackson-core", version.ref = "jackson" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mongodb-bson = { group = "org.mongodb", name = "bson", version.ref = "mongodb-bson" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
